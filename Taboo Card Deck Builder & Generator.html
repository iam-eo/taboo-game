<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Taboo Deck Creator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #090d16; color: #f8fafc; font-family: sans-serif; padding: 16px; max-width: 500px; margin: 0 auto; }
        .app-card { background-color: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .flex { display: flex; }
        .justify-between { justify-content: space-between; }
        .items-center { align-items: center; }
        .gap-2 { gap: 8px; }
        .space-y-3 > * + * { margin-top: 12px; }
        .w-full { width: 100%; }
        input, select { background-color: #090d16; border: 1px solid #334155; border-radius: 12px; padding: 10px 12px; color: #ffffff; font-size: 12px; outline: none; width: 100%; }
        input:focus, select:focus { border-color: #6366f1; }
        label { display: block; font-size: 11px; font-weight: bold; color: #cbd5e1; margin-bottom: 4px; }
        button { cursor: pointer; border: none; border-radius: 12px; font-weight: bold; font-size: 12px; padding: 10px 14px; color: white; }
        .btn-primary { background: linear-gradient(to right, #4f46e5, #9333ea); width: 100%; padding: 14px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; background: #334155; }
        .btn-export { background-color: #059669; }
        .badge-cat { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; font-size: 11px; font-weight: bold; border: 1px solid; transition: opacity 0.2s; }
        .badge-active { background-color: rgba(99, 102, 241, 0.2); color: #c7d2fe; border-color: rgba(99, 102, 241, 0.5); }
        .badge-inactive { background-color: #090d16; color: #64748b; border-color: #1e293b; }
        .badge-disabled { opacity: 0.4; cursor: not-allowed; }
        .hidden { display: none; }
        .card-grid-item { background-color: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 12px; margin-bottom: 8px; }
        .forbidden-pill { background-color: #090d16; color: #cbd5e1; font-size: 9px; font-weight: bold; padding: 4px; text-align: center; border-radius: 6px; border: 1px solid #1e293b; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        a.api-link { color: #818cf8; text-decoration: underline; font-weight: bold; }
        a.api-link:hover { color: #a5b4fc; }
    </style>
</head>
<body>

    <!-- HEADER & EXPORT -->
    <div class="app-card flex justify-between items-center" style="border-color: rgba(99, 102, 241, 0.3);">
        <div>
            <h1 style="font-weight: 900; font-size: 16px; color: white;">TABOO AI DECK BUILDER</h1>
            <p style="font-size: 11px; color: #94a3b8;">Generates Real & Unique Words</p>
        </div>
        <button onclick="exportJSON()" class="btn-export">
            <i class="fa-solid fa-download" style="margin-right: 4px;"></i> EXPORT JSON
        </button>
    </div>

    <!-- API KEY & CONFIG -->
    <div class="app-card space-y-3">
        <div>
            <label>Gemini API Key (Required for real AI words):</label>
            <input type="password" id="apiKeyInput" placeholder="Paste your API Key here...">
            <p style="font-size: 10px; color: #94a3b8; margin-top: 6px;">
                Don't have a key? Get a free API key at 
                <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" class="api-link">Google AI Studio</a>.
            </p>
        </div>

        <div>
            <div style="font-size: 11px; font-weight: bold; color: #cbd5e1; margin-bottom: 4px;">Batch Configuration:</div>
            <div id="projectedTotalText" style="font-size: 11px; color: #818cf8; font-weight: bold; background-color: #090d16; padding: 10px 12px; border: 1px solid #334155; border-radius: 12px;">
                Fixed Batch Size: 50 Cards per generation (1 Selected Category)
            </div>
        </div>
    </div>

    <!-- CATEGORY MANAGER -->
    <div class="app-card space-y-3">
        <div class="flex justify-between items-center">
            <div>
                <span style="font-size: 11px; font-weight: bold; color: #818cf8; text-transform: uppercase;">Active Categories</span>
                <span id="limitBadge" style="font-size: 9px; background-color: #1e1b4b; color: #a5b4fc; padding: 2px 6px; border-radius: 4px; margin-left: 6px;">Max 1 Selected</span>
            </div>
            <div style="font-size: 11px;">
                <button onclick="clearAll()" style="background: none; color: #94a3b8; padding: 0;">Clear</button>
            </div>
        </div>

        <div class="flex gap-2">
            <input type="text" id="newCatInput" placeholder="Add custom category..." style="flex: 1;">
            <button onclick="addCategory()" style="background-color: #4f46e5; padding: 0 14px;">+ Add</button>
        </div>

        <div id="categoryContainer" class="flex" style="flex-wrap: wrap; gap: 6px; padding-top: 4px;"></div>

        <button onclick="generateWithAI()" id="genBtn" class="btn-primary" style="margin-top: 8px;">
            <i class="fa-solid fa-wand-magic-sparkles" style="margin-right: 4px;"></i> GENERATE REAL CARDS VIA AI
        </button>
    </div>

    <!-- TIMER / STATUS DISPLAY -->
    <div id="progressBox" class="app-card hidden" style="margin-bottom: 16px;">
        <div class="flex justify-between items-center" style="font-size: 12px; font-weight: bold; color: #818cf8;">
            <span id="statusText">Contacting Gemini AI...</span>
            <span id="elapsedText" style="color: #a5b4fc; background: #090d16; padding: 4px 8px; border-radius: 6px; border: 1px solid #1e293b;">Time Elapsed: 0s</span>
        </div>
    </div>

    <!-- DECK PREVIEW -->
    <div>
        <div class="flex justify-between items-center" style="padding: 0 4px; margin-bottom: 8px;">
            <span style="font-size: 11px; font-weight: bold; color: #94a3b8;">Total Deck Cards: <strong id="totalBadge" style="color: white;">0</strong></span>
            <button onclick="clearWorkspace()" style="background: none; color: #fb7185; padding: 0;">Clear Deck</button>
        </div>
        <div id="cardsGrid"></div>
    </div>

<script>
let state = {
    categories: [
        { name: "General", selected: true },
        { name: "Places", selected: false },
        { name: "Food", selected: false },
        { name: "Pop Culture", selected: false },
        { name: "Music", selected: false },
        { name: "History", selected: false },
        { name: "Science", selected: false },
        { name: "Entertainment", selected: false },
        { name: "Jobs & Occupation", selected: false },
        { name: "Technology", selected: false }
    ],
    cards: []
};

let timerInterval = null;
let cooldownInterval = null;

window.onload = () => { 
    renderCategories(); 
};

function renderCategories() {
    const box = document.getElementById("categoryContainer");
    box.innerHTML = "";
    
    const selectedCount = state.categories.filter(c => c.selected).length;
    const isAtLimit = selectedCount >= 1;

    state.categories.forEach((cat, idx) => {
        const tag = document.createElement("div");
        const isDisabled = isAtLimit && !cat.selected;
        
        tag.className = `badge-cat ${cat.selected ? 'badge-active' : 'badge-inactive'} ${isDisabled ? 'badge-disabled' : ''}`;
        tag.innerHTML = `
            <span onclick="toggleCat(${idx})" style="cursor: ${isDisabled ? 'not-allowed' : 'pointer'};">${cat.name}</span>
            <button onclick="removeCat(${idx})" style="background: none; color: inherit; padding: 0; font-weight: 900;">×</button>
        `;
        box.appendChild(tag);
    });
    
    const limitBadge = document.getElementById("limitBadge");
    limitBadge.innerText = `${selectedCount}/1 Selected`;
    limitBadge.style.color = isAtLimit ? "#f87171" : "#a5b4fc";
}

function toggleCat(i) { 
    const selectedCount = state.categories.filter(c => c.selected).length;
    if (!state.categories[i].selected) {
        if (selectedCount >= 1) {
            state.categories.forEach(c => c.selected = false);
        }
    }
    state.categories[i].selected = !state.categories[i].selected; 
    renderCategories(); 
}

function removeCat(i) { state.categories.splice(i, 1); renderCategories(); }
function clearAll() { state.categories.forEach(c => c.selected = false); renderCategories(); }

function addCategory() {
    const val = document.getElementById("newCatInput").value.trim();
    if (val && !state.categories.some(c => c.name.toLowerCase() === val.toLowerCase())) {
        state.categories.push({ name: val, selected: false });
        document.getElementById("newCatInput").value = "";
        renderCategories();
    }
}

async function fetchWorkingModels(apiKey) {
    try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        const data = await res.json();
        if (data.models && Array.isArray(data.models)) {
            return data.models
                .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent"))
                .map(m => m.name.replace("models/", ""))
                .filter(name => name.includes("flash"));
        }
    } catch (e) {}
    return ["gemini-3.8-flash", "gemini-1.5-flash"];
}

async function generateWithAI() {
    const apiKey = document.getElementById("apiKeyInput").value.trim();
    if (!apiKey) return alert("Please enter your Gemini API key to generate real cards.");

    const selectedCats = state.categories.filter(c => c.selected);
    if (selectedCats.length === 0) return alert("Select a category.");
    if (selectedCats.length > 1) return alert("Please select only 1 category at a time.");

    const genBtn = document.getElementById("genBtn");
    genBtn.disabled = true;

    const progressBox = document.getElementById("progressBox");
    const statusText = document.getElementById("statusText");
    const elapsedText = document.getElementById("elapsedText");

    progressBox.classList.remove("hidden");
    statusText.innerText = "Discovering models...";
    
    // Live Time Elapsed Tracker
    let secondsElapsed = 0;
    elapsedText.innerText = `Time Elapsed: 0s`;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        secondsElapsed++;
        elapsedText.innerText = `Time Elapsed: ${secondsElapsed}s`;
    }, 1000);

    const modelsToTry = await fetchWorkingModels(apiKey);
    const totalTargetPerCat = 50; 
    const chunkSize = 50; 

    for (let i = 0; i < selectedCats.length; i++) {
        const catName = selectedCats[i].name;
        let generatedForCat = 0;

        while (generatedForCat < totalTargetPerCat) {
            const currentBatchSize = Math.min(chunkSize, totalTargetPerCat - generatedForCat);
            const existingTargets = state.cards.map(c => c.target);

            let exclusionClause = "";
            if (existingTargets.length > 0) {
                exclusionClause = `\nExclude: [${existingTargets.join(",")}]`;
            }

            statusText.innerText = `AI Generating ${catName} (50 Cards)...`;

            const prompt = `Category: ${catName}
Count: ${currentBatchSize}
Rules: Unique real-world Taboo cards. Include phrases, landmarks, proper nouns.${exclusionClause}
JSON format only:
{
  "cards": [
    {
      "category": "${catName.toUpperCase()}",
      "target": "WORD",
      "forbidden": ["F1", "F2", "F3", "F4", "F5"]
    }
  ]
}`;

            let success = false;
            let lastError = "";

            for (let attempt = 1; attempt <= 3; attempt++) {
                for (const modelName of modelsToTry) {
                    try {
                        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: prompt }] }],
                                generationConfig: { responseMimeType: "application/json" }
                            })
                        });

                        const data = await res.json();
                        
                        if (data.error) {
                            lastError = data.error.message;
                            continue;
                        }

                        if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                            lastError = "Empty candidate response";
                            continue;
                        }

                        let textResponse = data.candidates[0].content.parts[0].text;
                        textResponse = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
                        
                        const parsed = JSON.parse(textResponse);
                        
                        if (parsed.cards && Array.isArray(parsed.cards)) {
                            const newUniqueCards = parsed.cards.filter(newCard => 
                                !state.cards.some(existing => existing.target.toLowerCase() === newCard.target.toLowerCase())
                            );

                            state.cards.unshift(...newUniqueCards);
                            generatedForCat += newUniqueCards.length;
                            renderGrid();

                            success = true;
                            break;
                        }
                    } catch (e) {
                        lastError = e.message;
                    }
                }
                if (success) break;
                await new Promise(resolve => setTimeout(resolve, 800));
            }

            if (!success) {
                clearInterval(timerInterval);
                alert(`Error generating cards for ${catName}. Last error: ${lastError}`);
                progressBox.classList.add("hidden");
                genBtn.disabled = false;
                return;
            }
        }
    }

    clearInterval(timerInterval);
    startCooldown(genBtn, statusText, elapsedText, progressBox);
}

function startCooldown(genBtn, statusText, elapsedText, progressBox) {
    let cooldownRemaining = 15;
    statusText.innerText = "Generation complete!";
    elapsedText.innerText = `Cooldown: ${cooldownRemaining}s`;

    clearInterval(cooldownInterval);
    cooldownInterval = setInterval(() => {
        cooldownRemaining--;
        if (cooldownRemaining > 0) {
            elapsedText.innerText = `Cooldown: ${cooldownRemaining}s`;
            genBtn.innerText = `PLEASE WAIT (${cooldownRemaining}s)...`;
        } else {
            clearInterval(cooldownInterval);
            progressBox.classList.add("hidden");
            genBtn.disabled = false;
            genBtn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles" style="margin-right: 4px;"></i> GENERATE REAL CARDS VIA AI`;
        }
    }, 1000);
}

function renderGrid() {
    document.getElementById("totalBadge").innerText = state.cards.length;
    const grid = document.getElementById("cardsGrid");
    grid.innerHTML = "";

    state.cards.slice(0, 100).forEach(card => {
        const div = document.createElement("div");
        div.className = "card-grid-item";
        div.innerHTML = `
            <div class="flex justify-between items-center" style="margin-bottom: 6px;">
                <span style="font-size: 9px; font-weight: bold; color: #818cf8; background-color: #1e1b4b; padding: 2px 6px; border-radius: 4px; text-transform: uppercase;">${card.category}</span>
                <span style="font-size: 11px; font-weight: 900; color: white; text-transform: uppercase;">${card.target}</span>
            </div>
            <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;">
                ${card.forbidden.map(f => `<div class="forbidden-pill">${f}</div>`).join('')}
            </div>
        `;
        grid.appendChild(div);
    });
}

function clearWorkspace() { state.cards = []; renderGrid(); }
function exportJSON() {
    if (state.cards.length === 0) return alert("Deck is empty!");
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ cards: state.cards }, null, 2));
    const a = document.createElement('a');
    a.href = dataStr;
    a.download = "taboo_cards.json";
    a.click();
}
</script>
</body>
</html>
